name: Security Report
description: Report a security vulnerability (do not use for general bugs)
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not open a public issue for undisclosed vulnerabilities.**

        Use GitHub's private vulnerability reporting instead:
        **Security > Report a vulnerability** on the repository page.

        This template is for non-sensitive security-related discussions only.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the security concern (non-sensitive only).
    validations:
      required: true
