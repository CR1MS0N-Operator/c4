version: "3.8"

# ──────────────────────────────────────────────────────────────────────────────
#  ⚠️  DEPLOYMENT WARNING — READ BEFORE DEPLOYING
#
#  The passwords below are PLACEHOLDERS for local development only.
#  ALL default passwords (mythic_password, admin) MUST be changed before any
#  real deployment. Override via environment variables at runtime:
#
#    MYTHIC_ADMIN_PASSWORD=<strong-password>
#    MYTHIC_POSTGRES_PASSWORD=<strong-password>
#    MYTHIC_RABBITMQ_PASSWORD=<strong-password>
#
#  Never deploy with default credentials to an internet-exposed host.
#  Hasura secrets live in the C4 config file (~/.c4/c4.toml) under [hasura].
# ──────────────────────────────────────────────────────────────────────────────

# All secrets can be overridden via environment variables at runtime.
# Prefix any Compose environment variable with the service name,
# e.g. `MYTHIC_POSTGRES_PASSWORD=mysecret` to override the default.

services:
  mythic_postgres:
    image: postgres:15-alpine
    container_name: {{.Name}}_postgres
    restart: unless-stopped
    environment:
      # WARNING: Change POSTGRES_PASSWORD before production deployment!
      POSTGRES_USER: mythic
      POSTGRES_PASSWORD: mythic_password
      POSTGRES_DB: mythic_db
    volumes:
      - {{.DataDir}}/postgres:/var/lib/postgresql/data
    networks:
      - mythic

  mythic_rabbitmq:
    image: rabbitmq:3-alpine
    container_name: {{.Name}}_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mythic
      # WARNING: Change RABBITMQ_DEFAULT_PASS before production deployment!
      RABBITMQ_DEFAULT_PASS: mythic_password
    volumes:
      - {{.DataDir}}/rabbitmq:/var/lib/rabbitmq
    networks:
      - mythic

  mythic_server:
    image: itsafeaturemythic/mythic_server:{{.Version}}
    container_name: {{.Name}}_server
    restart: unless-stopped
    ports:
      - "{{.Port}}:443"
    environment:
      # WARNING: Change MYTHIC_ADMIN_PASSWORD before production deployment!
      MYTHIC_ADMIN_PASSWORD: admin
      MYTHIC_POSTGRES_HOST: mythic_postgres
      MYTHIC_POSTGRES_USER: mythic
      # WARNING: Change MYTHIC_POSTGRES_PASSWORD before production deployment!
      MYTHIC_POSTGRES_PASSWORD: mythic_password
      MYTHIC_POSTGRES_DB: mythic_db
      MYTHIC_RABBITMQ_HOST: mythic_rabbitmq
      MYTHIC_RABBITMQ_USER: mythic
      # WARNING: Change MYTHIC_RABBITMQ_PASSWORD before production deployment!
      MYTHIC_RABBITMQ_PASSWORD: mythic_password
      MYTHIC_SERVER_GRPC_PORT: "17444"
    volumes:
      - {{.DataDir}}/server:/mythic/
    networks:
      - mythic
    depends_on:
      - mythic_postgres
      - mythic_rabbitmq

  mythic_nginx:
    image: itsafeaturemythic/mythic_nginx:{{.Version}}
    container_name: {{.Name}}_nginx
    restart: unless-stopped
    ports:
      - "{{.Port}}:443"
    environment:
      MYTHIC_SERVER_HOST: mythic_server
      MYTHIC_DOMAIN: {{.Domain}}
    networks:
      - mythic
    depends_on:
      - mythic_server

  mythic_jupyter:
    image: itsafeaturemythic/mythic_jupyter:{{.Version}}
    container_name: {{.Name}}_jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - {{.DataDir}}/jupyter:/home/jovyan/work
    networks:
      - mythic
    depends_on:
      - mythic_server
    profiles:
      - jupyter

networks:
  mythic:
    driver: bridge
